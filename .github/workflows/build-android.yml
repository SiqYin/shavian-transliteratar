name: Build Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Stage web assets into the WebView bundle
        run: |
          mkdir -p android/app/src/main/assets/www/data
          cp index.html manifest.webmanifest sw.js android/app/src/main/assets/www/
          cp icon.svg icon-maskable.svg android/app/src/main/assets/www/
          cp -r web android/app/src/main/assets/www/
          cp data/noto-sans-shavian.woff2 android/app/src/main/assets/www/data/

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Rename artifact
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "ShavianTransliteratar-${GITHUB_REF_NAME#v}-android.apk"
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "ShavianTransliteratar-${GITHUB_REF_NAME#v}-android.apk"
          fi

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ShavianTransliteratar-*-android.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ShavianTransliteratar-*-android.apk
