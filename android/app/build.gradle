plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.siqyin.shavian'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.siqyin.shavian"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        release {
            def ksB64 = System.getenv("ANDROID_KEYSTORE_B64")
            if (ksB64) {
                def ksFile = new File(buildDir, "release.keystore")
                ksFile.parentFile.mkdirs()
                ksFile.bytes = ksB64.decodeBase64()
                storeFile ksFile
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // pure WebView shell, no external dependencies
}
